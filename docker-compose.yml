services:
  ollama:
    build:
      context: ./ollama

    container_name: ollama

    ports:
      - "11434:11434"

    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/qwen-warmup-complete"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

  postgres:
    image: postgres:15

    container_name: postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: cyberresponse
      POSTGRES_PASSWORD: cyberresponse
      POSTGRES_DB: incident_registry 

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberresponse -d incident_registry"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

  python:
    build:
      context: ./python
      dockerfile: Dockerfile

    container_name: python-app

    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: qllama/multilingual-e5-small
      CHAT_MODEL: qwen3:4b-instruct
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L2-v2
      HF_HOME: /root/.cache/huggingface
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: incident_registry
      POSTGRES_KNOWLEDGE_DB: knowledge
      POSTGRES_USER: cyberresponse
      POSTGRES_PASSWORD: cyberresponse

    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./python:/app
      - ./RAG:/app/RAG
      - ./knowledge:/app/knowledge

    working_dir: /app

    stdin_open: true
    tty: true

    command: python main.py

    restart: unless-stopped

volumes:
  ollama_data:
  pgdata:
  hf_cache:
