services:
  ollama:
    build:
      context: ./ollama

    container_name: ollama

    ports:
      - "11434:11434"

    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/qwen3:0.6b-warmup-complete && test -f /tmp/qwen3:4b-instruct-warmup-complete"]
      interval: 2s
      timeout: 5s
      retries: 50
      start_period: 30s

    restart: unless-stopped

  postgres:
    image: postgres:15

    container_name: postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: cyberresponse
      POSTGRES_PASSWORD: cyberresponse
      POSTGRES_DB: incident_registry 

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberresponse -d incident_registry"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0

    container_name: otel-collector

    command: ["--config=/etc/otelcol-contrib/config.yaml"]

    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"

    restart: unless-stopped

  python:
    build:
      context: ./python
      dockerfile: Dockerfile

    container_name: python-app

    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      emqx-1:
        condition: service_healthy
      emqx-2:
        condition: service_healthy
      emqx-3:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: qllama/multilingual-e5-small:q4_k_m
      PLAN_MODEL: qwen3:4b-instruct
      TRIAGE_MODEL: qwen3:0.6b
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L2-v2
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: incident_registry
      POSTGRES_KNOWLEDGE_DB: knowledge
      POSTGRES_USER: cyberresponse
      POSTGRES_PASSWORD: cyberresponse
      OTEL_SERVICE_NAME: cyber-response-agents
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      MQTT_BROKERS: "emqx-1:1883,emqx-2:1883,emqx-3:1883"
      MQTT_CLIENT_ID: "cyber-response-orchestrator"

    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./python:/app
      - ./RAG:/app/RAG
      - ./knowledge:/app/knowledge
      - ./postgres:/app/postgres
      - ./MAPE:/app/MAPE

    working_dir: /app

    stdin_open: true
    tty: true

    command: python main.py

    networks:
      - default
      - emqx-net

    restart: unless-stopped

  emqx-1:
    image: emqx:5.8.8

    hostname: node1.emqx.local

    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"

    environment:
      EMQX_NODE__NAME: "emqx@node1.emqx.local"
      EMQX_NODE__COOKIE: "cyberresponse-emqx-cluster"

      EMQX_CLUSTER__DISCOVERY_STRATEGY: "static"
      EMQX_CLUSTER__STATIC__SEEDS: '["emqx@node1.emqx.local","emqx@node2.emqx.local","emqx@node3.emqx.local"]'

    volumes:
      - emqx1_data:/opt/emqx/data
      - emqx1_log:/opt/emqx/log

    networks:
      emqx-net:
        aliases:
          - node1.emqx.local

    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

  emqx-2:
    image: emqx:5.8.8

    hostname: node2.emqx.local

    ports:
      - "1884:1883"
      - "8085:8083"
      - "8086:8084"
      - "18084:18083"

    environment:
      EMQX_NODE__NAME: "emqx@node2.emqx.local"
      EMQX_NODE__COOKIE: "cyberresponse-emqx-cluster"

      EMQX_CLUSTER__DISCOVERY_STRATEGY: "static"
      EMQX_CLUSTER__STATIC__SEEDS: '["emqx@node1.emqx.local","emqx@node2.emqx.local","emqx@node3.emqx.local"]'

    volumes:
      - emqx2_data:/opt/emqx/data
      - emqx2_log:/opt/emqx/log

    networks:
      emqx-net:
        aliases:
          - node2.emqx.local

    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

  emqx-3:
    image: emqx:5.8.8

    hostname: node3.emqx.local

    ports:
      - "1885:1883"
      - "8087:8083"
      - "8088:8084"
      - "18085:18083"

    environment:
      EMQX_NODE__NAME: "emqx@node3.emqx.local"
      EMQX_NODE__COOKIE: "cyberresponse-emqx-cluster"

      EMQX_CLUSTER__DISCOVERY_STRATEGY: "static"
      EMQX_CLUSTER__STATIC__SEEDS: '["emqx@node1.emqx.local","emqx@node2.emqx.local","emqx@node3.emqx.local"]'

    volumes:
      - emqx3_data:/opt/emqx/data
      - emqx3_log:/opt/emqx/log

    networks:
      emqx-net:
        aliases:
          - node3.emqx.local

    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped


networks:
  emqx-net:
    driver: bridge


volumes:
  ollama_data:
  pgdata:
  hf_cache:
  emqx1_data:
  emqx1_log:
  emqx2_data:
  emqx2_log:
  emqx3_data:
  emqx3_log:
