services:
  ollama:
    build:
      context: ./ollama

    container_name: ollama

    ports:
      - "11434:11434"

    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/qwen-warmup-complete"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

    restart: unless-stopped

  postgres:
    image: postgres:15

    container_name: postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: cyberresponse
      POSTGRES_PASSWORD: cyberresponse
      POSTGRES_DB: incident_registry 

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberresponse -d incident_registry"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0

    container_name: otel-collector

    command: ["--config=/etc/otelcol-contrib/config.yaml"]

    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"

    restart: unless-stopped

  python:
    build:
      context: ./python
      dockerfile: Dockerfile

    container_name: python-app

    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: qllama/multilingual-e5-small
      CHAT_MODEL: qwen3:4b-instruct
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L2-v2
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: incident_registry
      POSTGRES_KNOWLEDGE_DB: knowledge
      POSTGRES_USER: cyberresponse
      POSTGRES_PASSWORD: cyberresponse
      OTEL_SERVICE_NAME: cyber-response-agents
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"

    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./python:/app
      - ./RAG:/app/RAG
      - ./knowledge:/app/knowledge
      - ./postgres:/app/postgres
      - ./MAPE:/app/MAPE

    working_dir: /app

    stdin_open: true
    tty: true

    command: python main.py

    restart: unless-stopped

volumes:
  ollama_data:
  pgdata:
  hf_cache:
